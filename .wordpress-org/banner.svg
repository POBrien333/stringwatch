<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E5866"/>
      <stop offset="1" stop-color="#05242C"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".22" cy=".1" r=".7">
      <stop offset="0" stop-color="#5BEBC4" stop-opacity=".22"/>
      <stop offset=".7" stop-color="#5BEBC4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFEAE4"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93F7DD"/>
      <stop offset="1" stop-color="#1FBF97"/>
    </linearGradient>
    <linearGradient id="laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0"/>
      <stop offset=".12" stop-color="#FFC566"/>
      <stop offset=".88" stop-color="#FFC566"/>
      <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFB547" stop-opacity=".16"/>
    </linearGradient>
    <clipPath id="left"><rect x="0" y="0" width="126.5" height="256"/></clipPath>
    <clipPath id="right"><rect x="129.5" y="0" width="126.5" height="256"/></clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="7" result="o"/>
      <feFlood flood-color="#021216" flood-opacity=".55"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-10%" y="-500%" width="120%" height="1100%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1544" height="500" fill="url(#bg)"/>
  <rect width="1544" height="500" fill="url(#grid)"/>
  <rect width="1544" height="500" fill="url(#bloom)"/>

  <!-- the split A with the badge, from the icon, at 1.55x -->
  <g transform="translate(70 46) scale(1.55)">
    <g filter="url(#lift)">
      <path clip-path="url(#left)" fill-rule="evenodd" d="M58 206 L110 50 H146 L198 206 H164 L152 170 H104 L92 206 Z M113 142 H143 L128 94 Z" fill="url(#paper)"/>
      <g transform="translate(0 6)"><path clip-path="url(#right)" fill-rule="evenodd" d="M58 206 L110 50 H146 L198 206 H164 L152 170 H104 L92 206 Z M113 142 H143 L128 94 Z" fill="url(#mint)"/></g>
    </g>
    <g filter="url(#lift)">
      <path d="M178 22h50a14 14 0 0 1 14 14v42a14 14 0 0 1-14 14h-30l-16 14v-14h-4a14 14 0 0 1-14-14V36a14 14 0 0 1 14-14z" fill="url(#mint)"/>
    </g>
    <path d="M178 24h50a12 12 0 0 1 12 12v10H166V36a12 12 0 0 1 12-12z" fill="#ffffff" opacity=".22"/>
    <g transform="translate(169 29) scale(.6)" fill="none" stroke="#05242C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 14l8 9"/><path d="M8 40h12v38l9-8"/><path d="M44 16h36L50 50"/><path d="M56 26l32 26"/><path d="M46 62h40M50 75h32M42 89h50M66 58v40"/>
    </g>
    <circle cx="128" cy="160" r="8" fill="#FFB547" stroke="#05242C" stroke-width="3"/>
  </g>

  <!-- scan line across the whole banner, just past the seam -->
  <rect x="0" y="342" width="1544" height="40" fill="url(#wake)"/>
  <rect x="0" y="380" width="1544" height="4" rx="2" fill="url(#laser)" filter="url(#glow)"/>

  <!-- wordmark -->
  <text x="520" y="214" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Stringwatch</text>
  <text x="524" y="268" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="600" fill="#5BEBC4">Untranslated Text Finder for TranslatePress</text>
  <text x="524" y="326" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#CFEAE4">Finds every string you forgot to translate — page by page.</text>
</svg>
