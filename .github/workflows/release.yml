name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: wp-cli

      - name: Tag must match the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K\S+' stringwatch.php)
          CONST=$(grep -m1 -oP "TRWATCH_VERSION\s*=\s*'\K[^']+" stringwatch.php)
          echo "tag=$TAG header=$HEADER const=$CONST"
          test "$TAG" = "$HEADER" && test "$TAG" = "$CONST"

      - name: Build zip (git archive + .pot)
        run: |
          mkdir -p build
          git archive HEAD --prefix=stringwatch/ | tar -x -C build
          mkdir -p build/stringwatch/languages
          wp i18n make-pot build/stringwatch \
            build/stringwatch/languages/stringwatch.pot \
            --domain=stringwatch
          cd build && zip -rq ../stringwatch.zip stringwatch

      - uses: softprops/action-gh-release@v2
        with:
          files: stringwatch.zip
          generate_release_notes: true
