name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer phpcs

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build plugin folder as shipped
        run: |
          mkdir -p build
          git archive HEAD --prefix=stringwatch/ | tar -x -C build
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/stringwatch
